name: Verify Laravel API
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, xml, curl, dom
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: find app bootstrap config database routes tests public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run domain tests
        run: composer test
